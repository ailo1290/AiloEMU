app-id: io.github.ailoemu.AiloEMU
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ailoemu
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-download:ro
modules:
  - name: ailoemu
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/ailoemu /app/bin/ailoemu
      - cp -a cores /app/bin/cores
      - install -Dm644 io.github.ailoemu.AiloEMU.desktop /app/share/applications/io.github.ailoemu.AiloEMU.desktop
      - install -Dm644 io.github.ailoemu.AiloEMU.metainfo.xml /app/share/metainfo/io.github.ailoemu.AiloEMU.metainfo.xml
      - install -Dm644 io.github.ailoemu.AiloEMU.svg /app/share/icons/hicolor/scalable/apps/io.github.ailoemu.AiloEMU.svg
      - cp -a share/licenses /app/share/licenses/ailoemu
    sources:
      - type: dir
        path: ..
